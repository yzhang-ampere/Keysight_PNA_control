# Malagueta substrate-only differential four-port DUT measurements.
# One task makes one averaged acquisition and exports the N, P, and 4-port data.
- description: Malagueta substrate DDR14_CLK_0
  finished: false
  prompt: "Connect cable 1 <-- DDR14_CLK_0_N --> cable 2; cable 3 <-- DDR14_CLK_0_P --> cable 4."
  base_name: Malagueta_DDR14_CLK_0
  measurement_metadata:
    substrate: Malagueta
    measurement_type: differential_4port
    fixture_topology:
      deembedding_method: pending_fixture_setup
      side_a:
        physical_ports: [1, 3]
        endpoint: probe
        probes:
          - {physical_port: 1, probe_name: GTL65150GSDX probe, part_number: GTL65150GSDX, serial_number: REQUIRED_BEFORE_MEASUREMENT, touchstone: fixture/GTL65150GSDX_port1.s2p}
          - {physical_port: 3, probe_name: GTL65500GSDX probe, part_number: GTL65500GSDX, serial_number: REQUIRED_BEFORE_MEASUREMENT, touchstone: fixture/GTL65500GSDX_port3.s2p}
      side_b:
        physical_ports: [2, 4]
        endpoint: probe
        probes:
          - {physical_port: 2, probe_name: GTL65150GSDX probe, part_number: GTL65150GSDX, serial_number: REQUIRED_BEFORE_MEASUREMENT, touchstone: fixture/GTL65150GSDX_port2.s2p}
          - {physical_port: 4, probe_name: GTL65500GSDX probe, part_number: GTL65500GSDX, serial_number: REQUIRED_BEFORE_MEASUREMENT, touchstone: fixture/GTL65500GSDX_port4.s2p}
  port_combinations:
    - {ports: [1, 2], base_name: Malagueta_DDR14_CLK_0_N}
    - {ports: [3, 4], base_name: Malagueta_DDR14_CLK_0_P}
    - {ports: [1, 2, 3, 4], base_name: Malagueta_DDR14_CLK_0}
  subfolders: {1: raw_measure, 2: raw_measure, 3: raw_measure}

