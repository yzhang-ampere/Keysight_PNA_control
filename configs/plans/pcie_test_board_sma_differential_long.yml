# Supplemental PCIe long differential pairs on the SMA-to-SMA test board.
# Each task acquires one averaged sweep and exports N, P, and the combined S4P.

- description: PCIe test board long1, layer 5
  finished: false
  prompt: "Connect cable 1 <-- PCIE_long1_L5_N --> cable 2; cable 3 <-- PCIE_long1_L5_P --> cable 4."
  base_name: PCIE_long1_L5
  port_combinations:
    - {ports: [1, 2], base_name: PCIE_long1_L5_N}
    - {ports: [3, 4], base_name: PCIE_long1_L5_P}
    - {ports: [1, 2, 3, 4], base_name: PCIE_long1_L5}
  subfolders: {1: raw_measure}

